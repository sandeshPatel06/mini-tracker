<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#080e11" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05080a" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13222a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d171c" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080e11" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Grid lines subtle -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Card graphic on right -->
  <g transform="translate(740, 150)">
    <rect width="380" height="340" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
    <!-- Terminal header -->
    <circle cx="28" cy="28" r="6" fill="#ef4444" opacity="0.7" />
    <circle cx="48" cy="28" r="6" fill="#f59e0b" opacity="0.7" />
    <circle cx="68" cy="28" r="6" fill="#10b981" opacity="0.7" />
    <line x1="0" y1="50" x2="380" y2="50" stroke="#10b981" stroke-opacity="0.15" stroke-width="1" />

    <!-- Terminal content -->
    <text x="28" y="90" font-family="monospace" font-size="14" fill="#6ee7b7">$ get-hike status</text>
    <text x="28" y="125" font-family="monospace" font-size="13" fill="#94a3b8">Session: Active (01h 42m)</text>
    <text x="28" y="150" font-family="monospace" font-size="13" fill="#94a3b8">Entropy score: 8.42 (High focus)</text>
    <text x="28" y="175" font-family="monospace" font-size="13" fill="#94a3b8">AI analysis: Code Review (94%)</text>
    <text x="28" y="200" font-family="monospace" font-size="13" fill="#94a3b8">Storage: ~/.local/share/get-hike/</text>
    <text x="28" y="235" font-family="monospace" font-size="13" fill="#10b981">✓ Privacy mode: Zero cloud telemetry</text>
    <text x="28" y="260" font-family="monospace" font-size="13" fill="#10b981">✓ Keylogger: Disabled (by design)</text>
    <text x="28" y="295" font-family="monospace" font-size="12" fill="#64748b">Linux • Go + Wails • SQLite</text>
  </g>

  <!-- Left Content: Logo + Badge + Text -->
  <!-- Top badge -->
  <g transform="translate(90, 110)">
    <rect width="260" height="34" rx="17" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" />
    <circle cx="20" cy="17" r="4.5" fill="#10b981" />
    <text x="34" y="22" font-family="sans-serif" font-weight="600" font-size="13" fill="#34d399" letter-spacing="0.5">OPEN SOURCE &amp; LOCAL-FIRST</text>
  </g>

  <!-- Brand Name -->
  <g transform="translate(90, 220)">
    <!-- Hike Icon: stylized mountain & arrow -->
    <g transform="translate(0, -50)">
      <rect width="60" height="60" rx="14" fill="#0d171c" stroke="#10b981" stroke-width="2" />
      <path d="M16 44 L30 20 L44 44 Z" fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round" />
      <path d="M26 36 L30 30 L34 36 Z" fill="#34d399" />
      <circle cx="30" cy="14" r="3" fill="#10b981" />
    </g>
    <text x="76" y="-6" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="-1">get-Hike</text>
  </g>

  <!-- Heading -->
  <text x="90" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="#f8fafc" letter-spacing="-0.5">
    Own your focus.
  </text>
  <text x="90" y="352" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="44" fill="url(#emeraldGrad)" letter-spacing="-0.5">
    Keep your data.
  </text>

  <!-- Subtitle -->
  <text x="90" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" width="580">
    Privacy-first productivity tracking for Linux.
  </text>
  <text x="90" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" width="580">
    Entropy metrics, optional Gemini AI analysis, and zero cloud lock-in.
  </text>

  <!-- Footer pills -->
  <g transform="translate(90, 520)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748b">
      MIT License  •  REAK INFOTECH LLP  •  github.com/sandeshPatel06/mini-tracker
    </text>
  </g>
</svg>