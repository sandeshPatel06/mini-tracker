services:
  mini-tracker-api:
    build: .
    container_name: mini-tracker-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount the same data directory the desktop app uses
      - "${HOME}/.local/share/mini-tracker:/data"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATA_DIR=/data
      - PORT=8080
