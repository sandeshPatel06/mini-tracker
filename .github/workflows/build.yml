name: Build and Release Binary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Build Frontend React App
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Desktop & Server Binaries
        run: |
          mkdir -p bin
          log_info() { echo -e "\033[1;32m[BUILD]\033[0m $1"; }

          log_info "Building Desktop Application Binary (get-hike)..."
          go build -tags "desktop production webkit2_41" -ldflags="-s -w" -o bin/get-hike .
          cp -f bin/get-hike bin/mini-tracker

          log_info "Building Backend Server Binary (get-hike-server)..."
          go build -ldflags="-s -w" -o bin/get-hike-server ./cmd/server
          cp -f bin/get-hike-server bin/mini-tracker-server

          log_info "Generating SHA-256 Checksums..."
          (cd bin && sha256sum get-hike get-hike-server mini-tracker mini-tracker-server > checksums.txt)

      - name: Create Release Notes & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Automated build release $TAG_NAME"
          git push origin "$TAG_NAME"

          cat << EOF > release_notes.md
          # 📍 get-Hike Release \`${TAG_NAME}\`

          Automated production build generated from commit [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          ### 📦 Included Release Artifacts
          | Binary / File | Description | Target Environment |
          | :--- | :--- | :--- |
          | \`get-hike\` | Native Desktop Application | Client Desktop UI & 100% Offline Guest Mode |
          | \`get-hike-server\` | HTTP API & Analytics Server | Corporate Multi-User Backend Server |
          | \`checksums.txt\` | SHA-256 File Checksums | Security & Integrity Audit |

          ### ⚡ Quick Desktop Installation
          Run the one-line automated Linux installer:
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
          \`\`\`

          ---
          **Commit SHA**: \`${{ github.sha }}\`
          **Build Timestamp**: \`${BUILD_DATE}\`
          **Branch**: \`main\`
          EOF

          gh release create "$TAG_NAME" \
            bin/get-hike \
            bin/get-hike-server \
            bin/mini-tracker \
            bin/mini-tracker-server \
            bin/checksums.txt \
            --title "get-Hike $TAG_NAME ($SHORT_SHA)" \
            --notes-file release_notes.md

