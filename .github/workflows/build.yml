name: Build and Release Binary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend React App
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Server Binary
        run: |
          mkdir -p bin
          go build -o bin/mini-tracker-server ./cmd/server

      - name: Create Date Tag & Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-$(date +'%Y%m%d-%H%M%S')"
          git tag $TAG_NAME
          git push origin $TAG_NAME
          gh release create $TAG_NAME bin/mini-tracker-server --title "Release $TAG_NAME" --notes "Automated build binary for main branch"
